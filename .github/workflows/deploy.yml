name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Forbid Pages CNAME (keeps github.io from 301ing)
        run: bash scripts/check-pages.sh

      - name: Build
        run: npm run build

      - name: Forbid CNAME in the published artifact
        run: bash scripts/check-pages.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Read-only. Clearing cname requires repo admin; GITHUB_TOKEN gets 403.
      - name: Warn if Pages still has a custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cname="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // empty' || true)"
          echo "Pages cname=${cname:-<none>}"
          if [ -n "${cname}" ]; then
            echo "::warning::GitHub Pages custom domain is still '${cname}'. https://sunkara1111.github.io/portfolio/ will 301 there until a repo admin clicks Remove at Settings → Pages → Custom domain (or runs bash scripts/clear-pages-custom-domain.sh with an admin token)."
          fi
